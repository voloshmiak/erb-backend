basePath: /api
definitions:
  controller.CreateTrainInput:
    properties:
      route:
        items:
          type: string
        type: array
      wagonIds:
        items:
          type: string
        type: array
    type: object
  controller.edgeResponse:
    properties:
      distanceKm:
        type: integer
      from:
        type: string
      to:
        type: string
    type: object
  controller.fleetStatusResponse:
    properties:
      avgEmptyRunKmToday:
        type: number
      byType:
        additionalProperties:
          $ref: '#/definitions/usecase.WagonTypeStatus'
        type: object
      totalWagons:
        type: integer
    type: object
  controller.listOrdersResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/entity.Order'
        type: array
    type: object
  controller.listStationsResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/controller.edgeResponse'
        type: array
      stations:
        items:
          $ref: '#/definitions/controller.stationResponse'
        type: array
    type: object
  controller.listWagonsResponse:
    properties:
      statusCounts:
        additionalProperties:
          type: integer
        type: object
      wagons:
        items:
          $ref: '#/definitions/entity.Wagon'
        type: array
    type: object
  controller.simStatusResponse:
    properties:
      currentHour:
        type: integer
      displayTime:
        type: string
      speed:
        type: integer
    type: object
  controller.stationResponse:
    properties:
      lat:
        type: number
      lng:
        type: number
      name:
        type: string
      stationId:
        type: string
      type:
        type: string
    type: object
  entity.Order:
    properties:
      clientName:
        type: string
      createdAt:
        type: string
      desiredDate:
        type: string
      id:
        type: string
      quantity:
        type: integer
      stationToId:
        type: string
      status:
        $ref: '#/definitions/entity.OrderStatus'
      type:
        $ref: '#/definitions/entity.OrderType'
      wagonType:
        $ref: '#/definitions/entity.WagonType'
    type: object
  entity.OrderStatus:
    enum:
    - pending
    - matched
    - fulfilled
    - cancelled
    type: string
    x-enum-varnames:
    - Pending
    - Matched
    - Fulfilled
    - Cancelled
  entity.OrderType:
    enum:
    - external
    - internal
    type: string
    x-enum-varnames:
    - External
    - Internal
  entity.Train:
    properties:
      arrivedAt:
        type: string
      createdAt:
        type: string
      departedAt:
        type: string
      id:
        type: string
      locomotiveId:
        type: string
      nextStationId:
        type: string
      route:
        items:
          type: string
        type: array
      sourceStationId:
        type: string
      status:
        $ref: '#/definitions/entity.TrainStatus'
      stepIndex:
        type: integer
      wagonIds:
        items:
          type: string
        type: array
    type: object
  entity.TrainStatus:
    enum:
    - forming
    - in_transit
    - arrived
    type: string
    x-enum-varnames:
    - TrainForming
    - TrainInTransit
    - TrainArrived
  entity.Wagon:
    properties:
      currentStationId:
        type: string
      id:
        type: string
      lastUnloadTime:
        type: string
      number:
        type: string
      stateUntilHour:
        type: integer
      status:
        $ref: '#/definitions/entity.WagonStatus'
      type:
        $ref: '#/definitions/entity.WagonType'
    type: object
  entity.WagonStatus:
    enum:
    - loaded
    - empty_moving
    - idle
    - maintenance
    - in_train
    type: string
    x-enum-varnames:
    - Loaded
    - EmptyMoving
    - Idle
    - Maintenance
    - InTrain
  entity.WagonType:
    enum:
    - gondola
    - grain_hopper
    - cement_hopper
    type: string
    x-enum-varnames:
    - Gondola
    - GrainHopper
    - CementHopper
  usecase.CreateOrderInput:
    properties:
      clientName:
        type: string
      desiredDate:
        type: string
      quantity:
        type: integer
      stationToId:
        type: string
      type:
        $ref: '#/definitions/entity.OrderType'
      wagonType:
        $ref: '#/definitions/entity.WagonType'
    type: object
  usecase.MetricsOutput:
    properties:
      avgEmptyRunKm:
        type: number
      costSavedVsNaive:
        type: number
      matchRate:
        type: number
      naiveCost:
        type: number
      optimizedCost:
        type: number
      ordersMatched:
        type: integer
      ordersUnmatched:
        type: integer
      totalCostEmptyRun:
        type: integer
      totalDeliveredAssignments:
        type: integer
      totalEmptyRunKm:
        type: integer
      totalLoadedRunKm:
        type: integer
      totalRevenue:
        type: integer
    type: object
  usecase.WagonTypeStatus:
    properties:
      emptyMoving:
        type: integer
      idle:
        type: integer
      loaded:
        type: integer
      maintenance:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: This is the API documentation for the Empty Runner Buster application
  title: Empty Runner Buster API
  version: 1.2.5
paths:
  /docs:
    get:
      description: Serves the interactive API reference UI
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: API Documentation
      tags:
      - System
  /events/stream:
    get:
      description: Server-sent events stream for real-time wagon movement updates
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      summary: Events Stream
      tags:
      - Events
  /fleet/status:
    get:
      description: Returns wagon counts by type and status, plus average empty-run
        km for today
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.fleetStatusResponse'
        "500":
          description: Failed to retrieve fleet status
          schema:
            type: string
      summary: Fleet Status
      tags:
      - Wagon
  /health:
    get:
      description: Returns 200 OK when the service is healthy
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - System
  /metrics:
    get:
      description: 'Returns financial and operational metrics: empty run costs, revenue,
        cost saved vs naive'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.MetricsOutput'
        "500":
          description: Failed to retrieve metrics
          schema:
            type: string
      summary: Financial Metrics
      tags:
      - Metrics
  /orders:
    get:
      consumes:
      - application/json
      description: Retrieves all orders and their current status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.listOrdersResponse'
        "500":
          description: Failed to retrieve orders
          schema:
            type: string
      summary: List Orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: Places a new wagon order for a client
      parameters:
      - description: Order payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Order'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Failed to create order
          schema:
            type: string
      summary: Create Order
      tags:
      - Order
  /simulation:
    get:
      description: Returns current simulation clock state
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.simStatusResponse'
      summary: Simulation Status
      tags:
      - Simulation
  /stations:
    get:
      consumes:
      - application/json
      description: Retrieves all stations and active edges forming the railway graph
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.listStationsResponse'
        "500":
          description: Failed to retrieve stations
          schema:
            type: string
      summary: List Stations
      tags:
      - Station
  /trains:
    get:
      consumes:
      - application/json
      description: Returns a list of all active trains
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Train'
            type: array
        "500":
          description: Failed to list trains
          schema:
            type: string
      summary: List Active Trains
      tags:
      - Train
    post:
      consumes:
      - application/json
      description: Creates a new train from a list of wagons and a route
      parameters:
      - description: Train payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.CreateTrainInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Train'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Failed to create train
          schema:
            type: string
      summary: Create Train
      tags:
      - Train
  /trains/{id}:
    get:
      consumes:
      - application/json
      description: Returns details of a specific train
      parameters:
      - description: Train ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Train'
        "400":
          description: Invalid train id
          schema:
            type: string
        "404":
          description: Train not found
          schema:
            type: string
      summary: Get Train Details
      tags:
      - Train
  /trains/{id}/dispatch:
    post:
      consumes:
      - application/json
      description: Dispatches a forming train to start its journey
      parameters:
      - description: Train ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid train id
          schema:
            type: string
        "500":
          description: Failed to dispatch train
          schema:
            type: string
      summary: Dispatch Train
      tags:
      - Train
  /wagons:
    get:
      consumes:
      - application/json
      description: Retrieves all wagons and their current status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.listWagonsResponse'
        "500":
          description: Failed to retrieve wagons
          schema:
            type: string
      summary: List Wagons
      tags:
      - Wagon
swagger: "2.0"
