basePath: /api
definitions:
  controller.edgeResponse:
    properties:
      distanceKm:
        type: integer
      from:
        type: string
      to:
        type: string
    type: object
  controller.fleetStatusResponse:
    properties:
      avgEmptyRunKmToday:
        type: number
      byType:
        additionalProperties:
          $ref: '#/definitions/usecase.WagonTypeStatus'
        type: object
      totalWagons:
        type: integer
    type: object
  controller.listOrdersResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/entity.Order'
        type: array
    type: object
  controller.listStationsResponse:
    properties:
      edges:
        items:
          $ref: '#/definitions/controller.edgeResponse'
        type: array
      stations:
        items:
          $ref: '#/definitions/controller.stationResponse'
        type: array
    type: object
  controller.listWagonsResponse:
    properties:
      wagons:
        items:
          $ref: '#/definitions/entity.Wagon'
        type: array
    type: object
  controller.stationResponse:
    properties:
      lat:
        type: number
      lng:
        type: number
      name:
        type: string
      stationId:
        type: string
      type:
        type: string
    type: object
  entity.Order:
    properties:
      clientName:
        type: string
      createdAt:
        type: string
      desiredDate:
        type: string
      id:
        type: string
      quantity:
        type: integer
      stationToId:
        type: string
      status:
        $ref: '#/definitions/entity.OrderStatus'
      wagonType:
        $ref: '#/definitions/entity.WagonType'
    type: object
  entity.OrderStatus:
    enum:
    - pending
    - matched
    - fulfilled
    - cancelled
    type: string
    x-enum-varnames:
    - Pending
    - Matched
    - Fulfilled
    - Cancelled
  entity.Wagon:
    properties:
      currentStationId:
        type: string
      id:
        type: string
      lastUnloadTime:
        type: string
      number:
        type: string
      status:
        $ref: '#/definitions/entity.WagonStatus'
      type:
        $ref: '#/definitions/entity.WagonType'
    type: object
  entity.WagonStatus:
    enum:
    - loaded
    - empty_moving
    - idle
    - maintenance
    type: string
    x-enum-varnames:
    - Loaded
    - EmptyMoving
    - Idle
    - Maintenance
  entity.WagonType:
    enum:
    - gondola
    - grain_hopper
    - cement_hopper
    type: string
    x-enum-varnames:
    - Gondola
    - GrainHopper
    - CementHopper
  usecase.CreateOrderInput:
    properties:
      clientName:
        type: string
      desiredDate:
        type: string
      quantity:
        type: integer
      stationToId:
        type: string
      wagonType:
        $ref: '#/definitions/entity.WagonType'
    type: object
  usecase.WagonTypeStatus:
    properties:
      emptyMoving:
        type: integer
      idle:
        type: integer
      loaded:
        type: integer
      maintenance:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: This is the API documentation for the Empty Runner Buster application
  title: Empty Runner Buster API
  version: 1.1.4
paths:
  /docs:
    get:
      description: Serves the interactive API reference UI
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: API Documentation
      tags:
      - System
  /events/stream:
    get:
      description: Server-sent events stream for real-time wagon movement updates
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream
          schema:
            type: string
      summary: Events Stream
      tags:
      - Events
  /fleet/status:
    get:
      description: Returns wagon counts by type and status, plus average empty-run
        km for today
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.fleetStatusResponse'
        "500":
          description: Failed to retrieve fleet status
          schema:
            type: string
      summary: Fleet Status
      tags:
      - Wagon
  /health:
    get:
      description: Returns 200 OK when the service is healthy
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Health Check
      tags:
      - System
  /orders:
    get:
      consumes:
      - application/json
      description: Retrieves all orders and their current status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.listOrdersResponse'
        "500":
          description: Failed to retrieve orders
          schema:
            type: string
      summary: List Orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      description: Places a new wagon order for a client
      parameters:
      - description: Order payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/usecase.CreateOrderInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Order'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Failed to create order
          schema:
            type: string
      summary: Create Order
      tags:
      - Order
  /stations:
    get:
      consumes:
      - application/json
      description: Retrieves all stations and active edges forming the railway graph
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.listStationsResponse'
        "500":
          description: Failed to retrieve stations
          schema:
            type: string
      summary: List Stations
      tags:
      - Station
  /wagons:
    get:
      consumes:
      - application/json
      description: Retrieves all wagons and their current status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.listWagonsResponse'
        "500":
          description: Failed to retrieve wagons
          schema:
            type: string
      summary: List Wagons
      tags:
      - Wagon
swagger: "2.0"
